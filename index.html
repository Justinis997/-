          <div class="nav-mega nav-mega--photography" data-nav-dropdown>
            <div class="nav-mega__inner">
              <section class="nav-mega__primary" aria-label="探索摄影">
                <p class="nav-mega__label">探索摄影</p>
                <div class="nav-mega__large-links">

                  <a href="./photography.html?category=表面">表面</a>
                  <a href="./photography.html?category=风光">风光</a>

                  <a href="./photography.html?category=陌生人">陌生人</a>
                  <a href="./photography.html?category=生物">生物</a>

              </section>

            <div class="nav-mega__inner">
              <section class="nav-mega__primary" aria-label="浏览随笔">
                <p class="nav-mega__label">浏览随笔</p>
                <div class="nav-mega__large-links" role="tablist" aria-label="随笔浏览方式">
                  <button class="nav-mega__switch is-active" type="button" role="tab" data-nav-panel-target="time" aria-selected="true" aria-controls="nav-essay-time-panel">时间</button>
                  <button class="nav-mega__switch" type="button" role="tab" data-nav-panel-target="category" aria-selected="false" aria-controls="nav-essay-category-panel">类别</button>

              </section>

                </div>

            </div>

        <div class="nav-item nav-item--tools" data-nav-menu="tools">
          <button class="nav-trigger nav-trigger--button" type="button" aria-haspopup="true" aria-expanded="false">Tools</button>
          <div class="nav-mega nav-mega--tools" data-nav-dropdown>
            <div class="nav-mega__inner">
              <section class="nav-mega__primary" aria-label="探索工具">
                <p class="nav-mega__label">探索工具</p>
                <div class="nav-mega__large-links nav-mega__tool-links">

                    <span class="nav-tool-link__title">Pick One</span>

              </section>

  <main class="home-main">
    <section class="home-card home-card--news reveal">
      <div class="home-card__header">
        <h1 class="section-heading">
          <span class="zh">最新消息</span>
          <span class="en">Latest News</span>
        </h1>
      </div>
      <div class="news-overview" data-news-overview>
        <section class="news-panel" aria-labelledby="recent-activity-title">
          <h2 class="news-panel__title" id="recent-activity-title">近期动态</h2>
          <p class="news-activity">在ai的天空中翱翔，在token的海洋中流浪</p>
        </section>
        <section class="news-panel news-panel--updates" aria-labelledby="recent-updates-title">
          <h2 class="news-panel__title" id="recent-updates-title">作品更新</h2>
          <div class="update-counts" aria-label="本次更新内容">
            <div class="update-count">
              <p class="update-count__value">
                <span class="update-count__label">摄影作品</span>
                <span class="update-count__number" data-update-count="photography">0</span>
                <span class="update-count__unit">张</span>
              </p>
            </div>
            <div class="update-count">
              <p class="update-count__value">
                <span class="update-count__label">随笔</span>
                <span class="update-count__number" data-update-count="essays">0</span>
                <span class="update-count__unit">篇</span>
              </p>
            </div>
          </div>
        </section>
      </div>
    </section>

    <section class="home-card reveal">
      <div class="home-card__header">
        <h2 class="section-heading">
          <span class="zh">最新摄影</span>
          <span class="en">Latest Photography</span>
        </h2>
        <a class="home-card__more" href="./photography.html">查看全部</a>
      </div>
      <div class="latest-photos" data-latest-photos></div>
    </section>

    <section class="home-card reveal" id="latest-essays">
      <div class="home-card__header">
        <h2 class="section-heading">
          <span class="zh">最新随笔</span>
          <span class="en">Latest Essays</span>
        </h2>
      </div>
      <div class="essay-preview-grid" data-latest-essays></div>
    </section>
  </main>

  <dialog class="photo-lightbox" data-home-lightbox role="dialog" aria-modal="true" aria-labelledby="home-lightbox-title">
    <button class="lightbox-close" type="button" data-home-lightbox-close aria-label="关闭作品预览">×</button>
    <button class="lightbox-control lightbox-control--previous" type="button" data-home-lightbox-previous aria-label="上一张作品"></button>
    <figure class="lightbox-figure">
      <div class="lightbox-media">
        <span class="photo-fallback" data-home-lightbox-fallback aria-hidden="true"></span>
        <img data-home-lightbox-image alt="">
      </div>
      <figcaption>
        <span id="home-lightbox-title" data-home-lightbox-title></span>
        <span data-home-lightbox-meta></span>
      </figcaption>
    </figure>
    <button class="lightbox-control lightbox-control--next" type="button" data-home-lightbox-next aria-label="下一张作品"></button>
  </dialog>

  <dialog class="essay-dialog" data-essay-dialog aria-modal="true" aria-labelledby="essay-dialog-title">
    <article class="essay-dialog__article">
      <button class="essay-dialog__close" type="button" data-essay-dialog-close aria-label="关闭随笔">×</button>
      <time class="essay-dialog__date" data-essay-dialog-date></time>
      <h2 id="essay-dialog-title" data-essay-dialog-title></h2>
      <div class="essay-dialog__content" data-essay-dialog-content></div>
    </article>
  </dialog>
